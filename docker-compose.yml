# MediaScribe one-click Docker Compose.
#
# Usage:
#   docker compose up -d --build
#   docker compose logs -f
#   docker compose down
#
# The Web UI is exposed on http://localhost:8000.
# Transcripts land in ./web-workspace on the host.

services:
  web:
    container_name: mediascribe-web
    build:
      context: .
      dockerfile: Dockerfile
    # Local build (Dockerfile ENV already pins MEDIASCRIBE_WORKSPACE=/workspace);
    # pin a stable local tag instead of a version tag that drifts from pyproject.
    image: mediascribe:local
    ports:
      - "8000:8000"
    volumes:
      # Persist transcripts / downloads on the host.  Pairs with
      # MEDIASCRIBE_WORKSPACE=/workspace baked into the image, so everything
      # the app writes under the workspace lands in ./web-workspace.
      - ./web-workspace:/workspace
      # Sync container clock with the host's timezone.  Only works on
      # Linux/macOS hosts (the file does not exist on Windows; Docker
      # Desktop there would fail the mount) — uncomment on those hosts:
      # - /etc/localtime:/etc/localtime:ro
    environment:
      - PYTHONUNBUFFERED=1
      # Wired into the web layer's logging setup
      - MEDIASCRIBE_LOG_LEVEL=info
    restart: unless-stopped
    # Add GPU passthrough by uncommenting on a host with nvidia-container-toolkit:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
