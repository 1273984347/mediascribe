# Cody (Sourcegraph) custom instructions for Video2Text
# Read alongside AGENTS.md (the universal AI-agent guide).

## Project
Video2Text is an offline video transcription tool. It downloads from Bilibili,
Douyin, and local files, then transcribes audio with local AI models (Whisper,
WhisperX, faster-whisper). No cloud, no API keys, no Douyin cookies.

## Stack
- Python 3.8+ (3.12 recommended)
- `video2text/` — core lib
- `douyin_batch/` — batch lib (browser, cache, retry, progress, i18n, security)
- `douyin_batch_v3.py` — main CLI

## Conventions
- `pathlib.Path` everywhere.
- Type hints on all public functions. English docstrings.
- User-visible strings go through `t()` from `douyin_batch/i18n.py`.
  Add new keys to the `Messages` class as `{"en": "...", "zh": "..."}`.
- PEP 604 / PEP 585 syntax requires `from __future__ import annotations`.

## Tests
- `python run_tests.py` — 38 tests, ~5 s, all must pass.
- New code in `douyin_batch/` or `video2text/` needs a unit test in
  `douyin_batch/tests/`.

## Hard rules
- Never commit `output/`, `models/`, `*.cookies`, `.env`, `my_config.json`.
- Never add deps without updating `pyproject.toml` + `requirements.txt`.
- Use `douyin_batch.security.is_safe_url()` and
  `douyin_batch.platform_compat.safe_filename()`.

