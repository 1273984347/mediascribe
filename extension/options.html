<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video2Text Sender — Settings</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; color: #0f172a; }
    label { display: block; font-weight: 600; margin: 12px 0 4px; }
    input, select { width: 100%; box-sizing: border-box; padding: 6px 8px; font-size: 14px; border: 1px solid #cbd5e1; border-radius: 4px; }
    button { margin-top: 16px; background: #0ea5e9; color: white; border: none; padding: 8px 14px; font-size: 14px; border-radius: 4px; cursor: pointer; }
    .hint { color: #475569; font-size: 13px; }
    p.ok { color: #16a34a; }
  </style>
</head>
<body>
  <h1>Video2Text Sender</h1>
  <p class="hint">Set the URL of the Video2Text Web UI you want to send videos to. The default points to a local uvicorn instance on port 8000.</p>

  <label>API endpoint</label>
  <input id="endpoint" type="text" placeholder="http://127.0.0.1:8000">

  <label>Default engine</label>
  <select id="engine">
    <option value="whisper">whisper</option>
    <option value="faster-whisper">faster-whisper</option>
    <option value="whisperx">whisperx</option>
  </select>

  <label>Default model</label>
  <select id="model">
    <option value="tiny">tiny</option>
    <option value="base">base</option>
    <option value="small">small</option>
    <option value="medium">medium</option>
  </select>

  <label>API token <span style="font-weight:400;color:#64748b">(optional; leave blank if the server has no auth)</span></label>
  <input id="apiToken" type="password" placeholder="Bearer token — matches VIDEO2TEXT_API_TOKEN on the server" autocomplete="off">

  <button id="save">Save</button>
  <p id="status"></p>

  <script src="options.js"></script>
</body>
</html>
