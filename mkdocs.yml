site_name: MediaScribe
site_description: Transcribe videos from 6 platforms to Markdown using Whisper
site_url: https://1273984347.github.io/mediascribe/
repo_url: https://github.com/1273984347/mediascribe
repo_name: example/mediascribe
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      # 默认 slugify 会把非 ASCII 字符整个丢掉 —— 中文标题的锚点会被截成
      # "#1" 这类无意义值，目录锚点全部失效。改用 Unicode 版 slugify，
      # 锚点形如 "#1-经验复用梳理"，与文档内既有链接写法一致。
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - autorefs

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Platforms: platforms.md
  - Engines: engines.md
  - Plugins: plugins.md
  - WeChat MP: wechat-mp.md
  - Web UI: web-ui.md
  - One-click launch: one-click.md
  - Browser extension: browser-extension.md
  - MCP server: mcp.md
  - Benchmarking: benchmarking.md
  - Long videos: chunking.md
  - Performance: performance.md
  - E2E testing: e2e-testing.md
  - CI matrix: ci-matrix.md
  - Roadmap v3.2: roadmap-v3.2.md
  - Roadmap v3.2b: roadmap-v3.2b.md
  - Changelog: changelog.md
  - Contributing: contributing.md
  - License: license.md
  - Downloaders: downloaders.md
  - 使用说明: 使用说明.md
  - Design notes: design/kimi-icon-motion-guide.md

extra:
  version:
    provider: mike
    default: stable
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/1273984347/mediascribe
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/mediascribe/

copyright: Copyright &copy; 2024–2026 MediaScribe contributors. Licensed under MIT.

# Strict mode: build fails on warnings.  Disable for now because
# some auto-generated sections may include stale cross-refs.
strict: false
