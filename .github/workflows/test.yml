name: Tests

on:
  push:
    branches: [ main, develop ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, develop ]
    # P1-4(2026-11-22): 仅 PR 路径做路径过滤。push 路径**有意不加**:
    # paths-ignore 对 tag push 同样生效, 会把"纯 md 差异的 v* tag"的
    # integration E2E 发布门禁整个跳过(风险>收益); 本仓库当前直推
    # main 无 PR 流, 此项是 PR 流建立后的结构性防御。
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      run_integration:
        description: "Run the integration / E2E job"
        type: boolean
        default: false
  schedule:
    # Nightly integration run (UTC 02:00 = 10:00 CST)。
    # P3-9(2026-11-22 采样 5 个 schedule run): 免费档排队比早前注释写的
    # "~07:00" 更严重 —— 实际启动 08:39-09:55 UTC(排队 6.5-8h), 属免费
    # 额度资源竞争, 非 bug。nightly 期间 whisperx 由 integration job 的
    # schedule 条件步装回(回归兜底, 见 integration job)。
    - cron: "0 2 * * *"

# Cancel in-progress runs of the same branch; do NOT cancel for tags
# or release branches where we want every commit to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read
  issues: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Windows runner 默认 cp1252 — CLI help 里的 emoji 会让子进程
  # UnicodeEncodeError 崩溃;统一 UTF-8。
  PYTHONUTF8: "1"

jobs:
  # -------------------------------------------------------------------------
  # 1. lint — fastest possible feedback (~15s)
  # -------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # P2-8(2026-11-22 CI 优化): ubuntu-24.04 镜像无预装 py3.11,
      # setup-python 要 1m00s; ubuntu-latest(26.04) 预装, 27-38s。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # P0-3(2026-11-22 CI 优化): pip → uv, 缓存由 setup-uv 托管
      # (enable-cache; 原 setup-python 的 cache: pip 移除避免双重缓存)。
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install lint tools
        # 上游 ruff 0.17 起不再支持 `--statistics` + 非文本输出格式组合,
        # 保险起见锁到与本地开发一致的版本。mypy 与 dev extra 同参
        # (>=1.15,<3) — 2026-10-03 起为阻断门禁, 单独轻量安装避免
        # 拖整个 dev extra(torch 等)进来。
        run: uv pip install --system "ruff==0.16.6" "mypy>=1.15,<3"
      - name: ruff check
        run: ruff check . --output-format=github
      - name: ruff format (check only)
        run: ruff format --check --diff .
      - name: mypy (blocking since 2026-10-03)
        # dev extra 自带 mypy(pinned >=1.15,<3)。2026-10-03 全量类型错误
        # 清零后设为 PR 阻断门禁, 防止类型债回流。
        run: mypy mediascribe

  # -------------------------------------------------------------------------
  # 2. unit — fast unit-test feedback for PRs (~60s)
  #    Skips: integration / network / e2e / slow tests
  #    Runs on every push and every PR.
  # -------------------------------------------------------------------------
  unit:
    name: Unit tests (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # P0-2 补位(2026-11-22): integration 收窄后, py3.12 的 ubuntu 完整
        # 套件覆盖此前由 integration job 顺带承担, 现移入 unit matrix。
        python-version: ["3.11", "3.12"]
        os: [ubuntu-latest]
    env:
      # Force-skip the E2E decorator regardless of accidental env vars.
      MEDIASCRIBE_E2E: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install ffmpeg + ffprobe (Ubuntu, static build)
        # apt 源在 runner 上易卡死(2026-10-02 复盘: 挂满 10/20 分钟作业超时,
        # 是首推红灯最大来源)。改用 BtbN GitHub Release 静态构建, 走 GitHub
        # CDN 数秒完成, 自带 ffmpeg + ffprobe。
        if: runner.os == 'Linux'
        run: |
          curl -fsSL --retry 3 -o /tmp/ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p /tmp/ffx
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffx
          sudo find /tmp/ffx -type f -name ffmpeg -exec install -m 0755 {} /usr/local/bin/ffmpeg \;
          sudo find /tmp/ffx -type f -name ffprobe -exec install -m 0755 {} /usr/local/bin/ffprobe \;
          ffmpeg -version | head -1
      - name: Install Python deps (uv sync --locked)
        # P2-6(2026-11-22): uv.lock 锁定 207 包 —— 消除同 run 解析漂移
        # (实测: unit 装 torch 2.15.0 / integration 装 2.8.0)。
        # pytest-cov 由 dev extra 提供。uv 缓存(enable-cache)走硬链接,
        # 安装步相对 pip 大幅缩短。
        run: >-
          uv sync --locked
          --extra dev --extra ocr --extra web --extra faster-whisper --extra mcp
      - name: Run unit tests (with coverage)
        # YAML 折叠标量(>)把多行折成一行 — Windows pwsh 不认 ``\`` 续行,
        # 之前尾随的 ``\`` 被当成独立参数(= 盘根目录)让 pytest 扫全盘。
        run: >-
          uv run --no-sync pytest tests/
          --ignore=tests/test_e2e_real_urls.py
          -m "not integration and not network"
          --cov=mediascribe --cov-report=term-missing
          --cov-report=xml --cov-fail-under=75
          -v --tb=short --maxfail=5
      - name: Upload coverage.xml artifact
        # Codecov 挂掉时报告不丢,可从 artifact 手动补传
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # -------------------------------------------------------------------------
  # 3. integration — slower E2E + cross-platform matrix
  #    Triggered only on:
  #      * push to main (post-merge sanity)
  #      * tag push (release gate)
  #      * workflow_dispatch with run_integration=true (manual)
  #      * nightly cron (security + dependency drift detection)
  # -------------------------------------------------------------------------
  integration:
    name: Integration & E2E (py${{ matrix.python-version }}, ${{ matrix.os }})
    if: |
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_integration) ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # P0-2(2026-11-22 CI 优化): integration 只跑 integration 标记测试
        # (15 个真实 URL E2E, tests/test_e2e_real_urls.py —— 注意它们是
        # integration+network 双标记, 选择器必须用 `-m integration` 而非
        # "integration and not network")。unit 套件(1612 用例)此前在 4 个
        # job 里各重跑一遍, 现由 unit job(ubuntu py3.11+3.12)与 Windows
        # py3.11 全量守卫覆盖。
        # Windows py3.11 保留**全量** `-m "not network"`: 该平台历史踩坑
        # 最多(路径/编码/pwsh 续行), per-push 保留一个 Windows 回归守卫。
        include:
          - { os: ubuntu-latest, python-version: "3.11", pytest_args: '-m integration' }
          - { os: ubuntu-latest, python-version: "3.12", pytest_args: '-m integration' }
          - { os: windows-latest, python-version: "3.11", pytest_args: '-m "not network"' }
          - { os: windows-latest, python-version: "3.12", pytest_args: '-m integration' }
    env:
      MEDIASCRIBE_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install ffmpeg + ffprobe (Ubuntu, static build)
        # 同 unit job — apt 易卡死, 用 BtbN 静态构建
        if: runner.os == 'Linux'
        run: |
          curl -fsSL --retry 3 -o /tmp/ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p /tmp/ffx
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffx
          sudo find /tmp/ffx -type f -name ffmpeg -exec install -m 0755 {} /usr/local/bin/ffmpeg \;
          sudo find /tmp/ffx -type f -name ffprobe -exec install -m 0755 {} /usr/local/bin/ffprobe \;
          ffmpeg -version | head -1
      - name: Install ffmpeg + ffprobe (Windows, BtbN static build)
        # CI 优化(2026-11-21): choco → BtbN 静态构建,与 Linux 同构 ——
        # 数秒完成且去掉 choco 的偶发失败面(2026-10-02 复盘: 安装类步骤
        # 是首推红灯最大来源)。
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl.exe -fsSL --retry 3 -o "$env:RUNNER_TEMP\ffmpeg.zip" "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP\ffx" -Force
          $bin = "$env:RUNNER_TEMP\ffbin"
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Copy-Item (Get-ChildItem "$env:RUNNER_TEMP\ffx" -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName "$bin\ffmpeg.exe"
          Copy-Item (Get-ChildItem "$env:RUNNER_TEMP\ffx" -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName "$bin\ffprobe.exe"
          Add-Content $env:GITHUB_PATH $bin
          & "$bin\ffmpeg.exe" -version | Select-Object -First 1
      - name: Install Python deps (uv sync --locked)
        # P0-1(2026-11-22 CI 优化): 去掉 whisperx extra —— 无任何测试 import
        # whisperx(transcribers/whisperx.py:181 函数内懒加载;
        # test_imports.py:46-49 有未装降级逻辑), 而它经
        # pyannote→speechbrain→lightning 拉入 torch/CUDA 全链,
        # 曾让 integration deps 比 unit 多 ~1m40s。回归由 nightly(下方
        # 条件步)与 tag/develop matrix 兜底(用户 2026-11-22 拍板)。
        if: github.event_name != 'schedule'
        run: >-
          uv sync --locked
          --extra dev --extra ocr --extra web --extra faster-whisper --extra mcp
      - name: Install Python deps (nightly, whisperx backstop)
        # 用户拍板(2026-11-22): whisperx 回归由 nightly/tag matrix 兜底。
        # matrix job 装 whisperx; nightly cron 在此以 whisperx 全量 sync,
        # 让夜间跨平台跑也覆盖 whisperx 引擎。
        if: github.event_name == 'schedule'
        run: >-
          uv sync --locked
          --extra dev --extra ocr --extra web --extra whisperx --extra faster-whisper --extra mcp
      - name: Run integration tests (matrix-scoped selection)
        # 2026-11-22 CI 修复: Playwright chromium 四个步骤(cache/resolve/
        # install×2)整体移除 —— 证据链: integration 标记的 15 个 E2E 只调
        # parse_source 做纯 URL 解析(无下载无浏览器); browser.py 仅被
        # batch_cli 使用; unit 套件从不装 chromium 也持续全绿。
        # (uv sync 后 playwright 在 .venv 而非系统 python, 原 resolve/
        # install 步骤在 windows 上 ModuleNotFoundError 硬红 —— 移除比
        # 修补 venv 兼容更彻底, 同时消灭 44606964411 实测的 5m08s 尾部)
        # 折叠标量 — Windows pwsh 不认 ``\`` 续行(见 unit job 说明)。
        # P0-2: 选择器来自 matrix(见上); ubuntu/py3.12 组合只跑 15 个
        # 真实 URL E2E(需要外网, 实测 runner 可出网——历史多轮绿);
        # windows py3.11 组合跑全量非 network 套件(Windows 回归守卫)。
        run: >-
          uv run --no-sync pytest tests/
          ${{ matrix.pytest_args }}
          -v --tb=short --maxfail=3
        # 折叠标量 — Windows pwsh 不认 ``\`` 续行(见 unit job 说明)。
        # P0-2: 选择器来自 matrix(见上); ubuntu/py3.12 组合只跑 15 个
        # 真实 URL E2E(需要外网, 实测 runner 可出网——历史多轮绿);
        # windows py3.11 组合跑全量非 network 套件(Windows 回归守卫)。
        run: >-
          uv run --no-sync pytest tests/
          ${{ matrix.pytest_args }}
          -v --tb=short --maxfail=3

  # -------------------------------------------------------------------------
  # 4. matrix — full cross-platform, cross-version smoke (release-only)
  #    Triggered on tag push (release gate) and on develop merges.
  #    This is the heaviest job; the unit + integration jobs above
  #    gate every PR.
  # -------------------------------------------------------------------------
  matrix:
    name: Full matrix (py${{ matrix.python-version }}, ${{ matrix.os }})
    if: |
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.8/3.9/3.10 已 EOL(2024-10/2025-10/2026-10), 下限 3.11;
        # 3.13 补上现役覆盖。
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest, windows-latest]
        exclude:
          # macOS runner is slow; only test 2 versions there
          - { python-version: "3.13", os: "macos-latest" }
    env:
      MEDIASCRIBE_E2E: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install ffmpeg + ffprobe (Ubuntu, static build)
        # 同 unit job — apt 易卡死, 用 BtbN 静态构建
        if: runner.os == 'Linux'
        run: |
          curl -fsSL --retry 3 -o /tmp/ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p /tmp/ffx
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffx
          sudo find /tmp/ffx -type f -name ffmpeg -exec install -m 0755 {} /usr/local/bin/ffmpeg \;
          sudo find /tmp/ffx -type f -name ffprobe -exec install -m 0755 {} /usr/local/bin/ffprobe \;
          ffmpeg -version | head -1
      - name: Install system ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg + ffprobe (Windows, BtbN static build)
        # CI 优化(2026-11-21): choco → BtbN 静态构建,与 Linux 同构 ——
        # 数秒完成且去掉 choco 的偶发失败面(2026-10-02 复盘: 安装类步骤
        # 是首推红灯最大来源)。
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl.exe -fsSL --retry 3 -o "$env:RUNNER_TEMP\ffmpeg.zip" "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP\ffx" -Force
          $bin = "$env:RUNNER_TEMP\ffbin"
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Copy-Item (Get-ChildItem "$env:RUNNER_TEMP\ffx" -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName "$bin\ffmpeg.exe"
          Copy-Item (Get-ChildItem "$env:RUNNER_TEMP\ffx" -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName "$bin\ffprobe.exe"
          Add-Content $env:GITHUB_PATH $bin
          & "$bin\ffmpeg.exe" -version | Select-Object -First 1
      - name: Install Python deps (uv sync --locked, incl. whisperx backstop)
        # 发布门禁深矩阵: whisperx extra 在此装回(用户 2026-11-22 拍板
        # "whisperx 回归由 nightly/tag matrix 兜底")。
        run: >-
          uv sync --locked
          --extra dev --extra ocr --extra web --extra whisperx --extra faster-whisper --extra mcp
      - name: Run unit tests
        run: >-
          uv run --no-sync pytest tests/
          --ignore=tests/test_e2e_real_urls.py
          -m "not integration and not network"
          -v --tb=short --maxfail=3

  # -------------------------------------------------------------------------
  # 5. coverage — 2026-11-21 CI 优化: 并入 unit job 后本独立 job 已删除。
  #    原因: 与 unit 的测试选择完全相同,每轮纯重复一整趟 install+测试
  #    (~216s runner 时间)。coverage/Codecov 逻辑现由 unit job 承担
  #    (阈值 75 与 README 覆盖率徽章一致,实测 ~79%)。
  # -------------------------------------------------------------------------


  # -------------------------------------------------------------------------
  # 6. notify — cron 失败必须出声(2026-10-29 修复)
  #    此前通知步埋在 integration job 里, `failure()` 只看本 job 前置步骤:
  #    lint/unit 失败时 integration 照常绿 → 三次 nightly 红灯零通知
  #    (issue #cron-failure 只有 10-14 一条)。独立 job + needs.*.result
  #    聚合后, 任何一个 job 失败都会出声。
  # -------------------------------------------------------------------------
  notify:
    name: Notify maintainer (cron failure)
    needs: [lint, unit, integration]
    if: >-
      always() &&
      contains(needs.*.result, 'failure') &&
      github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Notify maintainer on cron failure
        # cron-fail-notify 范式(用户技能库): schedule 失败主动建/评 issue, 杜绝静默 fail。
        # 触发条件在 job 级 if(needs.*.result 聚合); 步骤级 failure() 在
        # 无前置步骤的 job 里恒为 false, 不能再用。
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'cron-failure';
            const titlePrefix = 'MediaScribe nightly tests cron failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Cron run failed at ${new Date().toISOString()}. Run URL: ${runUrl}. Use gh run view ${context.runId} --log-failed to see what broke. Auto-created; close after triage.`;
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label, per_page: 10,
            });
            const existing = issues.data.find(i => i.title.startsWith(titlePrefix));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `Another failure at ${new Date().toISOString()}: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: titlePrefix + " (" + context.runId + ")",
                labels: [label],
                body: body,
              });
            }

  # NOTE: docs build/deploy lives in docs.yml (authoritative, `mkdocs build
  # --strict`).  A duplicate non-strict build here previously drifted from
  # the strict gate and was removed.
