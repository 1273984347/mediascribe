name: Tests

on:
  push:
    branches: [ main, develop ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      run_integration:
        description: "Run the integration / E2E job"
        type: boolean
        default: false
  schedule:
    # Nightly integration run (UTC 02:00 = 10:00 CST)
    - cron: "0 2 * * *"

# Cancel in-progress runs of the same branch; do NOT cancel for tags
# or release branches where we want every commit to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Windows runner 默认 cp1252 — CLI help 里的 emoji 会让子进程
  # UnicodeEncodeError 崩溃;统一 UTF-8。
  PYTHONUTF8: "1"

jobs:
  # -------------------------------------------------------------------------
  # 1. lint — fastest possible feedback (~15s)
  # -------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - name: Install lint tools
        # 上游 ruff 0.17 起不再支持 `--statistics` + 非文本输出格式组合,
        # 保险起见锁到与本地开发一致的版本。mypy 与 dev extra 同参
        # (>=1.15,<3) — 2026-10-03 起为阻断门禁, 单独轻量安装避免
        # 拖整个 dev extra(torch 等)进来。
        run: pip install "ruff==0.16.6" "mypy>=1.15,<3"
      - name: ruff check
        run: ruff check . --output-format=github
      - name: ruff format (check only)
        run: ruff format --check --diff .
      - name: mypy (blocking since 2026-10-03)
        # dev extra 自带 mypy(pinned >=1.15,<3)。2026-10-03 全量类型错误
        # 清零后设为 PR 阻断门禁, 防止类型债回流。
        run: mypy mediascribe douyin_batch

  # -------------------------------------------------------------------------
  # 2. unit — fast unit-test feedback for PRs (~60s)
  #    Skips: integration / network / e2e / slow tests
  #    Runs on every push and every PR.
  # -------------------------------------------------------------------------
  unit:
    name: Unit tests (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # PR feedback path: fastest single combo.
        # Add more combos here if you want broader coverage on PRs
        # (at the cost of slower PR feedback).
        python-version: ["3.11"]
        os: [ubuntu-latest]
    env:
      # Force-skip the E2E decorator regardless of accidental env vars.
      MEDIASCRIBE_E2E: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt
      - name: Install ffmpeg + ffprobe (Ubuntu, static build)
        # apt 源在 runner 上易卡死(2026-10-02 复盘: 挂满 10/20 分钟作业超时,
        # 是首推红灯最大来源)。改用 BtbN GitHub Release 静态构建, 走 GitHub
        # CDN 数秒完成, 自带 ffmpeg + ffprobe。
        if: runner.os == 'Linux'
        run: |
          curl -fsSL --retry 3 -o /tmp/ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p /tmp/ffx
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffx
          sudo find /tmp/ffx -type f -name ffmpeg -exec install -m 0755 {} /usr/local/bin/ffmpeg \;
          sudo find /tmp/ffx -type f -name ffprobe -exec install -m 0755 {} /usr/local/bin/ffprobe \;
          ffmpeg -version | head -1
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ocr,web,faster-whisper,mcp]"
      - name: Run unit tests
        # YAML 折叠标量(>)把多行折成一行 — Windows pwsh 不认 ``\`` 续行,
        # 之前尾随的 ``\`` 被当成独立参数(= 盘根目录)让 pytest 扫全盘。
        run: >-
          python -m pytest tests/
          --ignore=tests/test_e2e_real_urls.py
          -m "not integration and not network"
          -v --tb=short --maxfail=5

  # -------------------------------------------------------------------------
  # 3. integration — slower E2E + cross-platform matrix
  #    Triggered only on:
  #      * push to main (post-merge sanity)
  #      * tag push (release gate)
  #      * workflow_dispatch with run_integration=true (manual)
  #      * nightly cron (security + dependency drift detection)
  # -------------------------------------------------------------------------
  integration:
    name: Integration & E2E (py${{ matrix.python-version }}, ${{ matrix.os }})
    if: |
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_integration) ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.9/3.10 已 EOL 剔除; whisperx 对最新版支持滞后, 只测 3.11/3.12。
        python-version: ["3.11", "3.12"]
        os: [ubuntu-latest, windows-latest]
    env:
      MEDIASCRIBE_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt
      - name: Install ffmpeg + ffprobe (Ubuntu, static build)
        # 同 unit job — apt 易卡死, 用 BtbN 静态构建
        if: runner.os == 'Linux'
        run: |
          curl -fsSL --retry 3 -o /tmp/ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p /tmp/ffx
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffx
          sudo find /tmp/ffx -type f -name ffmpeg -exec install -m 0755 {} /usr/local/bin/ffmpeg \;
          sudo find /tmp/ffx -type f -name ffprobe -exec install -m 0755 {} /usr/local/bin/ffprobe \;
          ffmpeg -version | head -1
      - name: Install system ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg
          echo "C:\ProgramData\chocolatey\lib\ffmpeg\tools\ffmpeg\bin" >> $GITHUB_PATH
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ocr,web,whisperx,faster-whisper,mcp]"
      - name: Install Playwright chromium (Linux)
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Install Playwright chromium (Windows/macOS)
        if: runner.os != 'Linux'
        run: python -m playwright install chromium
      - name: Run unit + integration tests
        # 折叠标量 — Windows pwsh 不认 ``\`` 续行(见 unit job 说明)。
        run: >-
          python -m pytest tests/
          -m "not network or integration"
          -v --tb=short --maxfail=3
        # NOTE: `network`-marked tests are intentionally excluded here
        # because the integration runner does not have outbound network
        # access in all CI environments. They can be opted in by
        # adding the `network` marker locally with a separate workflow.

  # -------------------------------------------------------------------------
  # 4. matrix — full cross-platform, cross-version smoke (release-only)
  #    Triggered on tag push (release gate) and on develop merges.
  #    This is the heaviest job; the unit + integration jobs above
  #    gate every PR.
  # -------------------------------------------------------------------------
  matrix:
    name: Full matrix (py${{ matrix.python-version }}, ${{ matrix.os }})
    if: |
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.8/3.9/3.10 已 EOL(2024-10/2025-10/2026-10), 下限 3.11;
        # 3.13 补上现役覆盖。
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest, windows-latest]
        exclude:
          # macOS runner is slow; only test 2 versions there
          - { python-version: "3.13", os: "macos-latest" }
    env:
      MEDIASCRIBE_E2E: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt
      - name: Install ffmpeg + ffprobe (Ubuntu, static build)
        # 同 unit job — apt 易卡死, 用 BtbN 静态构建
        if: runner.os == 'Linux'
        run: |
          curl -fsSL --retry 3 -o /tmp/ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p /tmp/ffx
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffx
          sudo find /tmp/ffx -type f -name ffmpeg -exec install -m 0755 {} /usr/local/bin/ffmpeg \;
          sudo find /tmp/ffx -type f -name ffprobe -exec install -m 0755 {} /usr/local/bin/ffprobe \;
          ffmpeg -version | head -1
      - name: Install system ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install system ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg
          echo "C:\ProgramData\chocolatey\lib\ffmpeg\tools\ffmpeg\bin" >> $GITHUB_PATH
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ocr,web,faster-whisper,mcp]"
      - name: Run unit tests
        run: >-
          python -m pytest tests/
          --ignore=tests/test_e2e_real_urls.py
          -m "not integration and not network"
          -v --tb=short --maxfail=3

  # -------------------------------------------------------------------------
  # 5. coverage — always on, no separate runner if not needed (ubuntu py3.11)
  # -------------------------------------------------------------------------
  coverage:
    name: Coverage (py3.11, ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ocr,web,faster-whisper,mcp]" pytest-cov
      - name: Run with coverage
        env:
          MEDIASCRIBE_E2E: "0"
        run: >-
          python -m pytest tests/
          --ignore=tests/test_e2e_real_urls.py
          -m "not integration and not network"
          --cov=mediascribe --cov=douyin_batch --cov-report=term-missing
          --cov-report=xml --cov-fail-under=75
        # 阈值 75 与 README 覆盖率徽章一致（实测 ~79%）；
        # 之前的 90 从未达到过，只会让本 job 永远红着。
      - name: Upload coverage.xml artifact
        # Codecov 挂掉时报告不丢,可从 artifact 手动补传
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # NOTE: docs build/deploy lives in docs.yml (authoritative, `mkdocs build
  # --strict`).  A duplicate non-strict build here previously drifted from
  # the strict gate and was removed.
