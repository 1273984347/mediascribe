name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# Cancel in-progress runs of the same branch; do NOT cancel for tags
# or release branches where we want every commit to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
        os: [ubuntu-latest, macos-latest, windows-latest]
        # whisperx only supports py>=3.9; the importability check in
        # test_whisperx_fallback.py tolerates ImportError on 3.8.
        include:
          - { python-version: "3.8", os: ubuntu-latest, allow-ruff-extra: false }

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "0"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          pyproject.toml
          requirements.txt
          requirements-dev.txt

    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install ffmpeg

    - name: Install system dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install ffmpeg
        echo "C:\ProgramData\chocolatey\lib\ffmpeg\tools\ffmpeg\bin" >> $GITHUB_PATH

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,ocr,web]"

    - name: Run unit tests (no network)
      run: |
        python -m pytest douyin_batch/tests/ -v --tb=short --maxfail=3

    - name: Run E2E suite (opt-in, skipped without VIDEO2TEXT_E2E)
      run: |
        python -m pytest douyin_batch/tests/test_e2e_real_urls.py -v --tb=short
      env:
        VIDEO2TEXT_E2E: "0"

    - name: Lint with ruff
      run: |
        pip install ruff
        ruff check . --output-format=github

    - name: Build sdist + wheel
      run: |
        pip install build twine
        python -m build
        twine check dist/*

    - name: Upload dist artifacts
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: actions/upload-artifact@v4
      with:
        name: dist-${{ matrix.python-version }}-${{ matrix.os }}
        path: dist/
        retention-days: 7
        if-no-files-found: error

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: |
          pyproject.toml
          requirements-dev.txt
    - name: Install ruff
      run: pip install ruff
    - name: ruff check
      run: |
        ruff check . --output-format=github --statistics
    - name: ruff format (check only)
      run: |
        ruff format --check --diff .

  coverage:
    name: Coverage (py3.11, ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: |
          pyproject.toml
          requirements.txt
          requirements-dev.txt
    - name: Install deps + coverage
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,ocr,web]"
        pip install pytest-cov
    - name: Run tests with coverage
      run: |
        python -m pytest douyin_batch/tests/ \
          --cov=video2text --cov=douyin_batch --cov-report=term-missing \
          --cov-report=xml --cov-fail-under=60
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        flags: unittests
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build-docs:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    - name: Install mkdocs
      run: |
        pip install mkdocs mkdocs-material
        pip install -e ".[dev]"
    - name: Build (strict)
      run: |
        mkdocs build --strict
      continue-on-error: true
      # docs may not be ported to mkdocs yet; this is a soft check
