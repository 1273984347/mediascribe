# Bandit security scan
#
# Runs PyCQA's Bandit against the two source trees that ship in the
# project.  Bandit flags common Python security anti-patterns
# (hard-coded secrets, weak crypto, ``subprocess`` shells, unsafe
# deserialisation, …) that the rest of the test suite does not catch.
#
# This workflow:
#   * Scans ``mediascribe/`` and ``douyin_batch/`` (production code).
#   * Skips ``tests/`` (test fixtures often contain intentionally
#     fake secrets / weak tokens — that is *not* a vulnerability).
#   * Uploads the JSON report as a build artifact for review.
#   * Hard-fails on MEDIUM+ findings (bandit exit code is propagated);
#     the report artifact is kept for post-mortem review.
#   * Single ubuntu job — bandit is a static scan, the former 3-OS
#     matrix was 3x the runner cost for identical output AND all three
#     jobs uploaded a same-named artifact, which upload-artifact@v4
#     rejects (2026-10-03 audit fix).

name: bandit

on:
  push:
    branches: [main, master, develop]
    paths:
      - "mediascribe/**"
      - "douyin_batch/**"
      - ".github/workflows/bandit.yml"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "mediascribe/**"
      - "douyin_batch/**"
      - ".github/workflows/bandit.yml"
  schedule:
    # Weekly scan so newly-discovered CVEs in our deps surface quickly
    # even if the dependency bumps themselves are silent.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bandit:
    name: bandit (ubuntu, py3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install "bandit>=1.7,<2.0"

      - name: Run Bandit
        # ``-ll`` raises the alarm threshold to medium+.  Test trees are
        # excluded by ``--exclude`` — they are allowed to use
        # obviously-fake secrets and weak tokens.  ``-q`` silences
        # per-file noise so the workflow log stays readable.
        run: |
          mkdir -p bandit-reports
          bandit \
            -r mediascribe douyin_batch \
            --exclude mediascribe/web/static,tests \
            -ll \
            -f json \
            -o bandit-reports/bandit-ubuntu.json || EXIT=$?
          # Also produce a human-readable summary for the workflow log.
          bandit \
            -r mediascribe douyin_batch \
            --exclude mediascribe/web/static,tests \
            -ll \
            -f txt \
            -o bandit-reports/bandit-ubuntu.txt || true
          # Re-emit the summary to the console for quick review.
          cat bandit-reports/bandit-ubuntu.txt
          # If a real run failed for reasons other than findings, propagate it.
          if [ -n "${EXIT:-}" ] && [ "$EXIT" -ne 0 ]; then exit "$EXIT"; fi

      - name: Upload Bandit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-reports
          path: bandit-reports/
          if-no-files-found: warn
          retention-days: 14
