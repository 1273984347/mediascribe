name: release

# v3.2.0a release workflow
#
# Trigger: push a tag matching ``v[0-9]+.[0-9]+.[0-9]+*`` (e.g. v3.2.0a, v3.2.0b).
#
# Pipeline:
#   1. ``lint``        — ruff + bandit on Python 3.12
#   2. ``test``        — pytest on Python 3.10 / 3.11 / 3.12
#                        across Ubuntu / macOS / Windows (matrix subset for speed)
#   3. ``build``       — sdist + manylinux wheel
#   4. ``publish-pypi``  — uses ``PYPI_API_TOKEN`` secret (id-token for OIDC)
#   5. ``publish-docker`` — multi-arch (linux/amd64 + linux/arm64) push to
#                           Docker Hub, tags ``<version>`` + ``latest``
#   6. ``github-release`` — uploads sdist/wheel + GITHUB_RELEASE_*.md
#
# Required secrets:
#   PYPI_API_TOKEN          (Trusted Publishing OIDC recommended)
#   DOCKERHUB_USERNAME      (or leave docker job disabled)
#   DOCKERHUB_TOKEN

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must exist on origin/main)'
        required: true
        default: 'v3.2.0a'

permissions:
  contents: write
  id-token: write   # PyPI OIDC

jobs:
  # ------------------------------------------------------------------
  # 1. lint
  # ------------------------------------------------------------------
  lint:
    name: lint (ruff + bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: mypy (non-blocking — surfaces type issues)
        # 类型检查当前为非阻断：历史代码未全量注解，阻断会拖垮发布。
        # 作为 advisory 步骤逐步收敛。
        continue-on-error: true
        run: mypy mediascribe douyin_batch
      - name: bandit (skip tests/, gate on HIGH)
        # 仅高危（HIGH）阻断发布；中危（MEDIUM）作为 artifact 留档。
        # MD5 缓存键已在 cache.py 标注 # nosec B324（非安全敏感）。
        run: |
          bandit -r mediascribe douyin_batch \
            --skip '*/tests/*' \
            --severity-level high \
            --confidence-level medium \
            --format json --output bandit-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  # ------------------------------------------------------------------
  # 2. test
  # ------------------------------------------------------------------
  test:
    name: test (${{ matrix.os }} · py${{ matrix.python }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'
      - run: pip install -e ".[dev,ocr,web,faster-whisper,mcp]"
      - name: pytest (deselect slow integration tests on PR builds)
        run: |
          python -m pytest --no-header -q -m "not integration and not network"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-logs-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            .pytest_cache
            **/test_output.log

  # ------------------------------------------------------------------
  # 3. build sdist + wheel
  # ------------------------------------------------------------------
  build:
    name: build (sdist + wheel)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install build
      - name: python -m build
        run: python -m build --sdist --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ------------------------------------------------------------------
  # 4. publish to PyPI
  # ------------------------------------------------------------------
  publish-pypi:
    name: publish · PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI via OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # OIDC: 不需要 PYPI_API_TOKEN secret,只需 pypi trusted publisher 已配
          # 如果还在用 API token,改为 password: ${{ secrets.PYPI_API_TOKEN }}

  # ------------------------------------------------------------------
  # 5. publish multi-arch Docker image
  # ------------------------------------------------------------------
  publish-docker:
    name: publish · Docker (${{ matrix.platform }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          [ "$TAG" = "$GITHUB_REF" ] && TAG=${{ github.event.inputs.tag }}
          echo "version=${TAG}" >> $GITHUB_OUTPUT
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            1273984347/mediascribe:${{ steps.version.outputs.version }}
            1273984347/mediascribe:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # 6. GitHub release
  # ------------------------------------------------------------------
  github-release:
    name: github · release
    needs: [build, publish-pypi, publish-docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract version
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          [ "$TAG" = "$GITHUB_REF" ] && TAG=${{ github.event.inputs.tag }}
          echo "version=${TAG}" >> $GITHUB_OUTPUT
      - name: Pick release notes file
        id: notes
        run: |
          VER=${TAG#v}  # strip leading v
          FILE="GITHUB_RELEASE_${VER}.md"
          if [ ! -f "$FILE" ]; then
            FILE="GITHUB_RELEASE.md"
          fi
          echo "file=${FILE}" >> $GITHUB_OUTPUT
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'a') || contains(steps.version.outputs.version, 'b') }}
          body_path: ${{ steps.notes.outputs.file }}
          files: |
            dist/*.tar.gz
            dist/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------
  # 7. summary
  # ------------------------------------------------------------------
  release-summary:
    name: release · summary
    needs: [publish-pypi, publish-docker, github-release]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Print summary
        run: |
          echo "## Release ${{ github.ref_name }} shipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- PyPI: https://pypi.org/project/mediascribe/${{ github.ref_name }}/" >> $GITHUB_STEP_SUMMARY
          echo "- Docker: docker pull 1273984347/mediascribe:${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
