name: Publish Docs

on:
  push:
    branches: [ main ]
    paths:
      - 'docs_site/**'
      - 'mkdocs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Avoid two deploys racing; cancel the in-flight one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    - name: Install deps
      run: |
        python -m pip install --upgrade pip
        pip install mkdocs mkdocs-material
        pip install -e ".[dev]"
    - name: Build
      run: mkdocs build --strict
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy
      id: deployment
      uses: actions/deploy-pages@v4
