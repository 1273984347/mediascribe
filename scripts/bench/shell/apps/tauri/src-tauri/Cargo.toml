[package]
name = "mediascribe-b3-tauri"
version = "3.2.0"
description = "B3 候选 —— Tauri 2 桌面壳 + FastAPI sidecar (L2 交付形态层基准)"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
