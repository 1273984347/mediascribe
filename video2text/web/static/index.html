<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video2Text Web UI</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --fg: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --ok: #22c55e;
      --err: #ef4444;
      --warn: #f59e0b;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--fg);
    }
    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 32px 16px 80px;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    h1 { font-size: 28px; margin: 0; }
    .lede { color: var(--muted); margin-bottom: 24px; }
    form {
      background: var(--panel);
      padding: 20px;
      border-radius: 12px;
      display: grid;
      gap: 12px;
    }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
    textarea, input, select {
      width: 100%;
      background: #0b1220;
      color: var(--fg);
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 14px;
      box-sizing: border-box;
    }
    textarea { min-height: 110px; font-family: ui-monospace, "Cascadia Code", Menlo, monospace; }
    .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    button {
      background: var(--accent);
      color: #0b1220;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      padding: 10px 16px;
      cursor: pointer;
    }
    button[disabled] { opacity: 0.5; cursor: not-allowed; }
    .status { font-size: 13px; color: var(--muted); }
    .results { margin-top: 24px; display: grid; gap: 16px; }
    .card {
      background: var(--panel);
      border-radius: 12px;
      padding: 16px;
      border-left: 4px solid var(--muted);
    }
    .card.ok { border-left-color: var(--ok); }
    .card.err { border-left-color: var(--err); }
    .card.warn { border-left-color: var(--warn); }
    .card h3 { margin: 0 0 4px; font-size: 15px; word-break: break-all; }
    .meta { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
    pre {
      background: #0b1220;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 12px;
      max-height: 360px;
      overflow: auto;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .toolbar { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .toolbar button {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 6px 10px;
      font-size: 12px;
    }
    .toolbar button.danger {
      color: var(--err);
      border-color: var(--err);
    }
    /* v3.2.0c Tier 2 — GPU pill */
    .gpu-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 12px;
      background: #0b1220;
      border: 1px solid #334155;
      color: var(--muted);
    }
    .gpu-pill .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted);
    }
    .gpu-pill.ok .dot { background: var(--ok); }
    .gpu-pill.ok { color: var(--fg); border-color: #334155; }
    .gpu-pill.loading .dot { background: var(--warn); animation: pulse 1.2s infinite ease-in-out; }
    .gpu-pill.unavailable .dot { background: var(--muted); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* v3.2.0c Tier 1 — progress bar */
    .progress {
      margin-top: 10px;
      display: grid;
      gap: 6px;
    }
    .progress-row {
      display: grid;
      grid-template-columns: 110px 1fr 50px;
      gap: 8px;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
    }
    .progress-bar {
      height: 6px;
      background: #0b1220;
      border-radius: 3px;
      overflow: hidden;
      border: 1px solid #334155;
    }
    .progress-bar > span {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.3s ease;
    }
    .progress-bar.done > span { background: var(--ok); }
    .progress-bar.cancelled > span { background: var(--muted); }
    .progress-bar.failed > span { background: var(--err); }
    footer { text-align: center; color: var(--muted); margin-top: 32px; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Video2Text</h1>
      <span id="gpu-pill" class="gpu-pill loading" title="GPU probe (refreshes every 5s)">
        <span class="dot"></span>
        <span id="gpu-label">GPU …</span>
      </span>
    </header>
    <p class="lede">Paste up to 20 video URLs (Bilibili, Douyin, YouTube, Xiaohongshu, WeChat MP, TikTok). The server runs each as a background job with stage-level progress and live cancellation via WebSocket.</p>

    <form id="form">
      <div>
        <label for="urls">Video URLs (one per line)</label>
        <textarea id="urls" placeholder="https://www.youtube.com/watch?v=..." required></textarea>
      </div>

      <div class="row">
        <div>
          <label for="engine">Engine</label>
          <select id="engine">
            <option value="whisper">whisper (baseline)</option>
            <option value="faster-whisper">faster-whisper</option>
            <option value="whisperx">whisperx</option>
          </select>
        </div>
        <div>
          <label for="model">Model</label>
          <select id="model">
            <optgroup label="快速预览">
              <option value="tiny">tiny</option>
              <option value="base">base</option>
              <option value="small" selected>small</option>
            </optgroup>
            <optgroup label="准确率优先">
              <option value="medium">medium</option>
              <option value="large">large</option>
              <option value="large-v1">large-v1</option>
              <option value="large-v2">large-v2</option>
              <option value="large-v3">large-v3 (推荐, 中文最佳)</option>
            </optgroup>
            <optgroup label="速度+准确率平衡">
              <option value="distil-large-v2">distil-large-v2</option>
              <option value="distil-large-v3">distil-large-v3</option>
            </optgroup>
          </select>
        </div>
        <div>
          <label for="language">Language (optional)</label>
          <input id="language" placeholder="zh, en, ja, ...">
        </div>
      </div>

      <div class="row">
        <div>
          <label for="ocr">OCR engine (WeChat images)</label>
          <select id="ocr">
            <option value="auto" selected>auto</option>
            <option value="paddleocr">paddleocr</option>
            <option value="pytesseract">pytesseract</option>
            <option value="easyocr">easyocr</option>
            <option value="none">none</option>
          </select>
        </div>
        <div>
          <label for="cookies">WeChat cookies (optional)</label>
          <input id="cookies" placeholder="wxuin=abc; pass_ticket=xyz">
        </div>
        <div>
          <label>&nbsp;</label>
          <label style="display:flex;align-items:center;gap:6px;">
            <input type="checkbox" id="bilingual"> Bilingual subtitles
          </label>
        </div>
      </div>

      <button id="submit" type="submit">Transcribe</button>
      <p class="status" id="status">Ready.</p>
    </form>

    <section class="results" id="results"></section>

    <footer>Video2Text v3.2.0c · <a href="/api/health" style="color:var(--accent);">/api/health</a> · <a href="/extension" style="color:var(--accent);">Browser extension</a></footer>
  </main>

  <script>
    const form = document.getElementById("form");
    const statusEl = document.getElementById("status");
    const results = document.getElementById("results");
    const submit = document.getElementById("submit");

    // -------------------------------------------------------------------------
    // v3.2.0c Tier 2 — GPU pill: poll /api/health every 5 s, render a pill.
    // -------------------------------------------------------------------------
    const gpuPill = document.getElementById("gpu-pill");
    const gpuLabel = document.getElementById("gpu-label");

    function fmtMb(mb) {
      if (mb == null) return "?";
      if (mb >= 1024) return (mb / 1024).toFixed(1) + " GiB";
      return Math.round(mb) + " MiB";
    }

    function renderGpuPill(health) {
      const gpu = health && health.gpu;
      if (!gpu || !gpu.available) {
        gpuPill.className = "gpu-pill unavailable";
        gpuLabel.textContent = "CPU only";
        return;
      }
      const name = gpu.name || gpu.device || "GPU";
      const shortName = name.length > 24 ? name.slice(0, 22) + "…" : name;
      const util = gpu.utilisation_pct != null ? ` · ${gpu.utilisation_pct}% util` : "";
      const vram = gpu.vram_total_mb != null
        ? ` · ${fmtMb(gpu.vram_used_mb)}/${fmtMb(gpu.vram_total_mb)}`
        : "";
      gpuPill.className = "gpu-pill ok";
      gpuLabel.textContent = `GPU: ${shortName}${vram}${util}`;
    }

    async function pollGpu() {
      try {
        const r = await fetch("/api/health");
        if (r.ok) renderGpuPill(await r.json());
        else gpuPill.className = "gpu-pill unavailable";
      } catch (_) {
        gpuPill.className = "gpu-pill unavailable";
      }
    }

    pollGpu();
    setInterval(pollGpu, 5000);

    // -------------------------------------------------------------------------
    // v3.2.0c Tier 1 — form submit → POST /api/jobs (async + cancel + WS)
    // -------------------------------------------------------------------------
    const STAGE_LABELS = {
      download: "Download",
      extract_audio: "Extract audio",
      transcribe: "Transcribe",
      merge: "Merge",
    };

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const urls = document.getElementById("urls").value
        .split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      if (urls.length === 0) return;
      submit.disabled = true;
      results.innerHTML = "";
      statusEl.textContent = "Submitting " + urls.length + " URL(s)…";
      try {
        const body = {
          urls,
          engine: document.getElementById("engine").value,
          model: document.getElementById("model").value,
          language: document.getElementById("language").value || null,
          ocr_engine: document.getElementById("ocr").value,
          wechat_cookies: document.getElementById("cookies").value || null,
          bilingual: document.getElementById("bilingual").checked,
        };
        const resp = await fetch("/api/jobs", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({ detail: resp.statusText }));
          throw new Error(err.detail || resp.statusText);
        }
        const data = await resp.json();
        const jobs = data.jobs || [];
        statusEl.textContent = `Submitted ${jobs.length} job(s). Tracking progress…`;
        for (const job of jobs) {
          renderJobCard(job);
        }
      } catch (err) {
        statusEl.textContent = "Error: " + err.message;
      } finally {
        submit.disabled = false;
      }
    });

    // -------------------------------------------------------------------------
    // Job card rendering + WS progress + cancel button + result polling
    // -------------------------------------------------------------------------
    function renderJobCard(job) {
      const card = document.createElement("article");
      card.className = "card warn";
      card.dataset.jobId = job.job_id;
      card.innerHTML = `
        <h3>${escapeHtml(job.url)}</h3>
        <p class="meta">job: <code>${escapeHtml(job.job_id)}</code> · stage: <span data-stage>queued</span></p>
        <div class="progress">
          ${["download", "extract_audio", "transcribe", "merge"].map(s => `
            <div class="progress-row">
              <span>${STAGE_LABELS[s]}</span>
              <div class="progress-bar" data-stage="${s}"><span style="width:0%"></span></div>
              <span data-pct="${s}">0%</span>
            </div>
          `).join("")}
        </div>
        <div class="toolbar">
          <button data-cancel>Cancel</button>
          <button data-result style="display:none;">Copy markdown</button>
          <button data-download style="display:none;">Download .md</button>
        </div>`;
      results.appendChild(card);

      // Cancel button
      card.querySelector("[data-cancel]").addEventListener("click", async () => {
        try {
          await fetch(`/api/jobs/${job.job_id}/cancel`, { method: "POST" });
          statusEl.textContent = `Cancellation requested for ${job.job_id}`;
        } catch (_) { /* network */ }
      });

      connectWs(card, job);
    }

    function connectWs(card, job) {
      const url = (location.protocol === "https:" ? "wss:" : "ws:") +
        "//" + location.host + `/ws/progress/${job.job_id}`;
      const ws = new WebSocket(url);

      function setStage(name, idx, pct) {
        const bar = card.querySelector(`.progress-bar[data-stage="${name}"]`);
        const label = card.querySelector(`[data-pct="${name}"]`);
        if (bar) bar.querySelector("span").style.width = pct + "%";
        if (label) label.textContent = Math.round(pct) + "%";
        const stageSpan = card.querySelector("[data-stage]");
        if (stageSpan) stageSpan.textContent = name;
      }

      function markBar(name, cls) {
        const bar = card.querySelector(`.progress-bar[data-stage="${name}"]`);
        if (bar) bar.classList.add(cls);
      }

      ws.onmessage = (ev) => {
        let msg;
        try { msg = JSON.parse(ev.data); } catch (_) { return; }
        if (!msg || typeof msg !== "object") return;
        const stage = msg.stage;
        const evt = msg.event;
        if (evt === "stage_start") setStage(stage, msg.stage_index, 0);
        else if (evt === "stage_progress") setStage(stage, msg.stage_index,
          msg.total > 0 ? (msg.current / msg.total) * 100 : 0);
        else if (evt === "stage_done") {
          setStage(stage, msg.stage_index, 100);
          markBar(stage, "done");
        } else if (evt === "succeeded") {
          markBar("merge", "done");
          card.classList.remove("warn");
          card.classList.add("ok");
          card.querySelector("[data-stage]").textContent = "done";
          fetchResult(card, job);
        } else if (evt === "failed") {
          card.classList.remove("warn");
          card.classList.add("err");
          const meta = card.querySelector(".meta");
          meta.innerHTML += `<br><span style="color:var(--err);">error: ${escapeHtml(msg.error || "unknown")}</span>`;
          ws.close();
        } else if (evt === "cancelled" || evt === "cancelled_done") {
          ["download", "extract_audio", "transcribe", "merge"].forEach(s => markBar(s, "cancelled"));
          card.classList.remove("warn");
          card.querySelector("[data-stage]").textContent = "cancelled";
          ws.close();
        }
      };
      ws.onerror = () => { /* server-side close will end the loop */ };
      ws.onclose = () => { /* done */ };
    }

    async function fetchResult(card, job) {
      try {
        const r = await fetch(`/api/jobs/${job.job_id}/result`);
        if (!r.ok) return;
        const data = await r.json();
        if (!data.markdown) return;
        const pre = document.createElement("pre");
        pre.textContent = data.markdown;
        card.appendChild(pre);
        const copyBtn = card.querySelector("[data-result]");
        const dlBtn = card.querySelector("[data-download]");
        copyBtn.style.display = "";
        dlBtn.style.display = "";
        copyBtn.addEventListener("click", () => {
          navigator.clipboard.writeText(data.markdown);
          statusEl.textContent = "Markdown copied for " + job.url;
        });
        dlBtn.addEventListener("click", () => {
          const blob = new Blob([data.markdown], { type: "text/markdown" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = (data.title || job.url).replace(/[^a-z0-9]+/gi, "_").slice(0, 60) + ".md";
          a.click();
          URL.revokeObjectURL(a.href);
        });
      } catch (_) { /* network */ }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }
  </script>
</body>
</html>
