[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mediascribe"
version = "3.3.0"
description = "Offline video transcription for Bilibili / Douyin / YouTube / Xiaohongshu / WeChat MP"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "MediaScribe Contributors"},
]
maintainers = [
    {name = "MediaScribe Maintainers", email = "maintainers@example.com"},
]
keywords = [
    "video",
    "transcription",
    "asr",
    "whisper",
    "whisperx",
    "faster-whisper",
    "bilibili",
    "douyin",
    "tiktok",
    "youtube",
    "xiaohongshu",
    "wechat-mp",
    "offline",
    "ai",
    "speech-to-text",
    "mcp",
    "model-context-protocol",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: Chinese (Traditional)",
    "Natural Language :: English",
    "Natural Language :: Multilingual",
]

dependencies = [
    # 20250625 起修复 torch>=2.6 默认 weights_only=True 导致的
    # .pt 模型 UnpicklingError；旧 whisper + 新 torch 是必崩组合。
    "openai-whisper>=20250625",
    "yt-dlp>=2023.12.30",
    "ffmpeg-python>=0.2.0",
    "requests>=2.31.0",
    # 1.63.0 (2026-09-15) 破坏 py3.11 上 mock 驱动的 browser 测试
    # (TestGetUserVideos::test_collects_multiple_videos, 见 CI run 35002197257),
    # 锁定 <1.63 待适配后放开。
    "playwright>=1.40.0,<1.63",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
]

# Third-party plugins can be discovered via entry_points; see
# docs/plugins.md.  Built-in extensions are listed in [project.entry-points].
[project.entry-points."mediascribe.downloaders"]
vimeo = "examples.plugins.vimeo_downloader:VimeoDownloader"

[project.entry-points."mediascribe.transcribers"]

[project.entry-points."mediascribe.url_transformers"]
tcn = "examples.plugins.tcn_transformer:transform"

[project.optional-dependencies]
# Higher-accuracy ASR engines (optional, user chooses)
whisperx = [
    "whisperx>=3.1.1",
    "pyannote.audio>=3.0.0",
]
faster-whisper = [
    "faster-whisper>=0.10.0",
]
# VAD (voice activity detection) for smart chunking
vad = [
    "webrtcvad>=2.0.10",
]
# OCR engines for WeChat MP image articles
ocr = [
    "paddleocr>=2.5.0",
    "pytesseract>=0.3.10",
    "easyocr>=1.6.2",
]
# MCP (Model Context Protocol) server support
mcp = [
    # 项目下限已是 3.11, 不再需要 python_version 标记
    "mcp>=0.5.0",
]
# LLM post-process (mediascribe.llm_post_process, OpenAI-compatible API)
llm = [
    "openai>=1.0.0",
]
# Web UI (FastAPI + uvicorn, served via ``uvicorn mediascribe.web.app:app``)
web = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
]
# Convenience meta-packages
all = [
    "mediascribe[whisperx,faster-whisper,ocr,mcp,web,llm]",
]
# Dev / CI tooling
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    # 上游 ruff 0.17 起不再支持 `--statistics` + 非文本输出格式组合,
    # 统一钉 0.16.x（CI 不再单独锁版本，这里是唯一事实源）。
    "ruff>=0.16,<0.17",
    "mypy>=1.7.0",
    # release.yml 的 lint job 经 `pip install -e ".[dev]"` 安装后直接跑
    # bandit，必须随 dev extra 提供（此前缺失导致发布链 exit 127）。
    "bandit>=1.7,<2.0",
    # 测试 mediascribe.llm_post_process 需要 openai 类型（CI 上 mock API 调用）
    "openai>=1.0.0",
    # learn.compare 的拼音相似度过滤依赖 pypinyin（缺失时降级为不过滤）
    "pypinyin>=0.44.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.urls]
Homepage = "https://github.com/1273984347/mediascribe"
Repository = "https://github.com/1273984347/mediascribe.git"
Issues = "https://github.com/1273984347/mediascribe/issues"
Changelog = "https://github.com/1273984347/mediascribe/blob/main/CHANGELOG.md"

[project.scripts]
mediascribe = "mediascribe.__main__:main"
mediascribe-batch = "mediascribe.batch_cli:main"

[tool.setuptools]
# 根级 douyin_batch_v3.py 已收编为包模块 mediascribe.batch_cli
# (2026-10-03 审查), 不再需要 py-modules。
packages = [
        "mediascribe",
        "mediascribe.downloaders",
        "mediascribe.transcribers",
        "mediascribe.web",
        "mediascribe.plugins",
        "douyin_batch",
        "examples",
        "examples.plugins",
    ]

[tool.setuptools.package-data]
mediascribe = ["py.typed"]

[tool.mypy]
# 3.8 已不是 mypy >=1.15 支持的检查目标（此前配置直接报错、被
# continue-on-error 掩盖）；与 requires-python 下限保持一致。
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests as integration (E2E / cross-module). Deselect with '-m \"not integration\"'.",
    "network: marks tests that require outbound network. Deselect with '-m \"not network\"'.",
    "slow: marks tests that take >5 seconds. Deselect with '-m \"not slow\"'.",
]

[tool.coverage.run]
source = ["mediascribe", "douyin_batch"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "archive",
    "build",
    "dist",
    "node_modules",
    "venv",
    ".venv",
    "__pycache__",
    "*.egg-info",
    "extract_douyin_browser.py",
]

[tool.ruff.lint]
# E402 (module level import not at top) is allowed in test files where
# we adjust sys.path before importing the package under test.
# F401 (unused import) is allowed in __init__.py files (see per-file-ignores).
# E501 is ignored globally: ``ruff format`` (line-length = 100) handles
# wrapping, and legacy lines slightly over 100 chars are not worth
# churning the whole repo for.
select = ["E", "F", "W", "I", "C4"]
ignore = [
    "E501",  # line too long — enforced by ruff format (line-length = 100)
    "E402",  # module level import not at top of file (test convention)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"**/tests/*.py" = ["E402", "E702", "F401", "F841"]
