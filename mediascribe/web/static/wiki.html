<!DOCTYPE html>
<!--
  MediaScribe 知识库视图 — 页面模板（Template）。
  与 index.html 同理：{{STATIC_VERSION}} 由后端注入，需经服务端访问：
  python -m mediascribe.web.app --port 8000 → http://127.0.0.1:8000/wiki
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>MediaScribe · 知识库</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23181817'/%3E%3Cg fill='%23ffffff'%3E%3Crect x='7' y='13' width='3' height='6' rx='1.2'/%3E%3Crect x='12.5' y='9' width='3' height='14' rx='1.2'/%3E%3Crect x='18' y='5' width='3' height='22' rx='1.2'/%3E%3Crect x='23.5' y='11' width='3' height='10' rx='1.2'/%3E%3C/g%3E%3C/svg%3E">
  <script>
    (function () {
      var t = "dark";
      try {
        t = localStorage.getItem("ms_theme")
          || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      } catch (_) { /* storage 不可用 */ }
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="/static/wiki.css?v={{STATIC_VERSION}}">
</head>
<body>
  <header>
    <div class="brand">
      <a class="back" href="/">← 转写台</a>
      <span class="wordmark">知识库</span>
    </div>
    <span class="path" id="vault-path" title="vault 目录 — 可用 Obsidian 直接打开"></span>
  </header>

  <main>
    <div class="grid">
      <nav class="panel" id="note-list" aria-label="笔记列表"></nav>
      <section class="panel viewer" id="viewer" aria-label="笔记内容">
        <div class="empty">← 从左侧选择一篇笔记查看原文</div>
      </section>
    </div>
  </main>

  <script type="module" src="/static/wiki.js?v={{STATIC_VERSION}}"></script>
</body>
</html>
