<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>MediaScribe · 视频转写台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23181817'/%3E%3Cg fill='%23ffffff'%3E%3Crect x='7' y='13' width='3' height='6' rx='1.2'/%3E%3Crect x='12.5' y='9' width='3' height='14' rx='1.2'/%3E%3Crect x='18' y='5' width='3' height='22' rx='1.2'/%3E%3Crect x='23.5' y='11' width='3' height='10' rx='1.2'/%3E%3C/g%3E%3C/svg%3E">
  <script>
    // 主题在绘制前确定, 避免闪色。默认跟随系统, 手动选择存 localStorage。
    (function () {
      var t = "dark";
      try {
        t = localStorage.getItem("ms_theme")
          || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      } catch (_) { /* storage 不可用 */ }
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- KIMI 官方字体系统: Inter(高效清晰) + Geist Mono(科技感等宽) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ------------------------------------------------------------------
       MEDIAScribe — 转写工作台
       设计语言: KIMI 式极简双主题。
       月之暗面 (dark) / 月之亮面 (light), token 对称:
       面板三层深浅 + 文字透明度分级 + 发丝描边 + 主按钮黑白反转。
       ------------------------------------------------------------------ */
    :root {
      color-scheme: dark;
      --bg: #181817;
      --surface: #121212;          /* 输入控件下沉面 */
      --raised: #1f1f1f;           /* 卡片抬升面 */
      --field-bg: #121212;
      --fg: rgba(255, 255, 255, 0.84);
      --fg-2: rgba(255, 255, 255, 0.56);
      --fg-3: rgba(255, 255, 255, 0.26);
      --line: rgba(255, 255, 255, 0.12);
      --line-strong: rgba(255, 255, 255, 0.32);
      --fill: rgba(255, 255, 255, 0.05);
      --fill-hover: rgba(255, 255, 255, 0.09);
      --primary-bg: rgba(255, 255, 255, 0.84);
      --primary-bg-hover: #ffffff;
      --primary-fg: #121212;
      --run-kbd-bg: rgba(0, 0, 0, 0.06);
      --run-kbd-fg: rgba(0, 0, 0, 0.5);
      --blue: #007cff;             /* KIMI 核心品牌蓝 */
      --green: #16c456;
      --red: #ff4756;
      --orange: #ff9f0a;
      --shimmer: linear-gradient(276deg, #ffffff 25%, #bcbcbc 65%, #5a5a5a 100%);
      --selection: rgba(255, 255, 255, 0.18);
      --dot: rgba(255, 255, 255, 0.05);   /* 蓝图点阵(De-coding 质感) */
      --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, "PingFang SC", "Microsoft YaHei", "Noto Sans", sans-serif;
      --mono: "Geist Mono", ui-monospace, "SF Mono", "Cascadia Code", Consolas, "PingFang SC", "Microsoft YaHei", monospace;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #fbfaf9;
      --surface: #ffffff;
      --raised: #ffffff;
      --field-bg: rgba(0, 0, 0, 0.03);
      --fg: rgba(0, 0, 0, 0.9);
      --fg-2: rgba(0, 0, 0, 0.56);
      --fg-3: rgba(0, 0, 0, 0.38);
      --line: rgba(0, 0, 0, 0.12);
      --line-strong: rgba(0, 0, 0, 0.32);
      --fill: rgba(0, 0, 0, 0.04);
      --fill-hover: rgba(0, 0, 0, 0.07);
      --primary-bg: rgba(0, 0, 0, 0.88);
      --primary-bg-hover: #000000;
      --primary-fg: #ffffff;
      --run-kbd-bg: rgba(255, 255, 255, 0.14);
      --run-kbd-fg: rgba(255, 255, 255, 0.6);
      --shimmer: linear-gradient(276deg, #1c1c1c 25%, #7a7a7a 65%, #c4c4c4 100%);
      --selection: rgba(0, 0, 0, 0.12);
      --dot: rgba(0, 0, 0, 0.045);
    }
    * { box-sizing: border-box; }
    html { scrollbar-color: var(--line) transparent; }
    body {
      margin: 0;
      font-family: var(--sans);
      font-size: 14px;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
    }
    ::selection { background: var(--selection); }
    :focus-visible { outline: 2px solid var(--line-strong); outline-offset: 2px; }

    /* ============ 顶栏 ============ */
    .console-top {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; flex-wrap: wrap;
      padding: 14px 24px;
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .wordmark { font-size: 15px; font-weight: 600; color: var(--fg); letter-spacing: 0.01em; }
    .model-tag { font-size: 12px; color: var(--fg-3); }
    .meters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    /* 任务运行指示 — 仅在有无任务时出现 */
    .rec { display: none; align-items: center; gap: 7px; font-size: 12px; color: var(--fg-2); }
    .rec.on { display: inline-flex; }
    .rec i { width: 6px; height: 6px; border-radius: 50%; background: var(--blue); animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .chip-status {
      display: inline-flex; align-items: center; gap: 7px;
      height: 32px; padding: 0 12px;
      border-radius: 10px;
      background: var(--fill);
      font-size: 12px; color: var(--fg-2);
      max-width: 100%;
      font-variant-numeric: tabular-nums;
    }
    .chip-status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--fg-3); flex: none; }
    .chip-status.ok .dot { background: var(--green); }
    .chip-status.loading .dot { background: var(--fg-2); animation: pulse 1.2s infinite; }
    .icon-btn {
      height: 32px; padding: 0 12px;
      display: inline-flex; align-items: center; gap: 6px;
      border: none; border-radius: 10px;
      background: var(--fill); color: var(--fg-2);
      font-family: var(--sans); font-size: 12px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .icon-btn:hover { background: var(--fill-hover); color: var(--fg); }

    /* ============ 主体 ============ */
    main { max-width: 880px; margin: 0 auto; padding: 36px 20px 40px; }
    main > * { animation: rise 0.4s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    main > *:nth-child(2) { animation-delay: 0.05s; }
    main > *:nth-child(3) { animation-delay: 0.1s; }
    main > *:nth-child(4) { animation-delay: 0.15s; }
    main > *:nth-child(5) { animation-delay: 0.2s; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } }

    .hero { margin: 4px 0 28px; }
    .hero h1 {
      font-size: 22px; font-weight: 600;
      letter-spacing: 0.01em; line-height: 1.4;
      margin: 0 0 8px;
    }
    .lede { color: var(--fg-2); font-size: 13px; line-height: 1.8; margin: 0; max-width: 62ch; }
    .lede code {
      color: var(--fg); background: var(--fill);
      border-radius: 6px; padding: 1px 6px; font-size: 12px;
      font-family: var(--mono);
    }

    /* ============ 输入面板 ============ */
    /* 蓝图点阵 — KIMI "核心几何 / De-coding" 质感 */
    .panel {
      background-image: radial-gradient(circle, var(--dot) 1px, transparent 1px);
      background-size: 22px 22px;
      background-color: var(--raised);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 24px;
      display: grid; gap: 16px;
    }
    .fld > label {
      display: flex; align-items: baseline; justify-content: space-between;
      font-size: 13px; font-weight: 500; color: var(--fg);
      margin-bottom: 7px;
    }
    .fld > label .hint { font-size: 12px; font-weight: 400; color: var(--fg-3); }
    textarea, input[type="text"], input[type="password"], select {
      width: 100%;
      background: var(--field-bg);
      color: var(--fg);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px 12px;
      font-family: var(--sans);
      font-size: 14px; line-height: 1.6;
      caret-color: var(--fg);
      transition: border-color 0.15s;
    }
    textarea { min-height: 104px; resize: vertical; font-family: var(--mono); font-size: 13px; }
    textarea::placeholder, input::placeholder { color: var(--fg-3); }
    textarea:focus, input:focus, select:focus {
      outline: none;
      border-color: var(--line-strong);
    }
    select {
      appearance: none;
      background-image:
        linear-gradient(45deg, transparent 50%, var(--fg-2) 50%),
        linear-gradient(135deg, var(--fg-2) 50%, transparent 50%);
      background-position: calc(100% - 16px) 55%, calc(100% - 11px) 55%;
      background-size: 5px 5px;
      background-repeat: no-repeat;
      padding-right: 30px;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
    .row-2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; }

    /* 开关 */
    .switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; padding: 9px 0; }
    .switch input { position: absolute; opacity: 0; pointer-events: none; }
    .switch .track {
      width: 36px; height: 20px; border-radius: 999px; flex: none;
      background: var(--fill); border: 1px solid var(--line);
      position: relative; transition: background 0.18s, border-color 0.18s;
    }
    .switch .track::after {
      content: ""; position: absolute; top: 2px; left: 2px;
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--fg-2); transition: transform 0.18s, background 0.18s;
    }
    .switch input:checked + .track { background: var(--primary-bg); border-color: transparent; }
    .switch input:checked + .track::after { transform: translateX(16px); background: var(--primary-fg); }
    .switch .sw-label { font-size: 13px; color: var(--fg-2); }
    /* 开关是 label, 但不参与上方两栏对齐 */
    .fld > label.switch, .fld label.switch {
      justify-content: flex-start; align-items: center; gap: 10px; margin-bottom: 0;
    }

    .run {
      width: 100%;
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      height: 44px;
      font-family: var(--sans); font-size: 14px; font-weight: 500;
      color: var(--primary-fg);
      background: var(--primary-bg);
      border: none; border-radius: 12px;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }
    .run:hover:not(:disabled) { background: var(--primary-bg-hover); }
    .run:disabled { opacity: 0.4; cursor: not-allowed; }
    .run kbd {
      font-family: var(--mono); font-size: 11px;
      background: var(--run-kbd-bg); color: var(--run-kbd-fg);
      border-radius: 4px; padding: 2px 6px;
    }
    .status { font-size: 12px; line-height: 1.7; color: var(--fg-2); margin: 0; min-height: 1.2em; }
    .status.err { color: var(--red); }

    /* ============ 输出队列 ============ */
    .output-head {
      display: flex; align-items: center; justify-content: space-between;
      margin: 36px 0 12px;
    }
    .output-head h2 {
      font-size: 13px; font-weight: 500; color: var(--fg);
      margin: 0;
    }
    .ghost {
      height: 32px; padding: 0 12px;
      font-family: var(--sans); font-size: 12px;
      background: var(--fill); color: var(--fg-2);
      border: none; border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .ghost:hover { background: var(--fill-hover); color: var(--fg); }

    .results { display: grid; gap: 12px; }
    .empty { padding: 40px 20px; text-align: center; color: var(--fg-3); font-size: 13px; }
    .card {
      background: var(--raised);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px 18px;
      animation: cardIn 0.3s cubic-bezier(0.2, 0.7, 0.2, 1) both;
    }
    @keyframes cardIn { from { opacity: 0; transform: translateY(6px); } }

    .card-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .chip {
      flex: none;
      font-size: 12px; font-weight: 500; line-height: 1;
      padding: 5px 10px; border-radius: 999px;
      background: var(--fill);
      color: var(--fg-2);
    }
    .chip.busy { color: var(--fg); }
    .chip.ok { color: var(--green); }
    .chip.err { color: var(--red); }
    .chip.cancelled { color: var(--fg-3); }
    .url {
      flex: 1; min-width: 200px;
      font-family: var(--mono); font-size: 12.5px; color: var(--fg);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .jid { flex: none; font-family: var(--mono); font-size: 11px; color: var(--fg-3); font-variant-numeric: tabular-nums; }

    /* 信号链进度 */
    .chain { display: flex; align-items: center; margin: 16px 2px 4px; }
    .node {
      flex: none;
      width: 22px; height: 22px; border-radius: 50%;
      display: grid; place-items: center;
      font-family: var(--mono); font-size: 9px; font-weight: 500;
      color: var(--fg-3);
      border: 1.5px solid var(--line);
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }
    .node.active {
      color: var(--fg); border-color: var(--fg);
      animation: nodePulse 1.6s ease-in-out infinite;
    }
    @keyframes nodePulse {
      0%, 100% { box-shadow: 0 0 0 3px var(--fill); }
      50% { box-shadow: 0 0 0 6px transparent; }
    }
    .node.done { color: #ffffff; background: var(--green); border-color: var(--green); }
    .node.fail { color: var(--red); border-color: var(--red); }
    .node.off { opacity: 0.35; }
    .seg { flex: 1; height: 2px; margin: 0 7px; background: var(--line); border-radius: 1px; position: relative; overflow: hidden; }
    .seg i { position: absolute; inset: 0; width: 0%; background: var(--fg); transition: width 0.3s ease; }
    .seg.done i { width: 100%; }
    /* KIMI 式运行中微光 — 宽度由进度内联控制 */
    .shimmer-bar {
      background: var(--shimmer);
      background-size: 200% 100%;
      animation: shimmerMove 1.8s linear infinite;
    }
    @keyframes shimmerMove { from { background-position: 200% 0; } to { background-position: -200% 0; } }
    .chain-meta {
      display: flex; align-items: baseline; gap: 8px;
      font-size: 12px; color: var(--fg-2);
      margin: 6px 2px 0;
      font-variant-numeric: tabular-nums;
    }
    .chain-meta .cm-label { color: var(--fg-3); }
    .chain-meta [data-stage-label] { color: var(--fg); font-weight: 500; }
    .chain-meta [data-stage-label][data-state="ok"] { color: var(--green); }
    .chain-meta [data-stage-label][data-state="err"] { color: var(--red); }
    .chain-meta [data-stage-label][data-state="off"] { color: var(--fg-3); }
    .chain-meta [data-pct] { margin-left: auto; font-weight: 500; }
    /* 运行态文字微光 */
    .running-text {
      background: var(--shimmer);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent !important;
      animation: shimmerMove 1.8s linear infinite;
    }

    .errmsg { display: none; margin: 10px 0 0; font-size: 12px; line-height: 1.7; color: var(--red); word-break: break-all; }
    .errmsg.show { display: block; }

    .toolbar { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .toolbar button {
      height: 32px; padding: 0 12px;
      font-family: var(--sans); font-size: 12px; font-weight: 500;
      background: var(--fill); color: var(--fg);
      border: none; border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .toolbar button:hover { background: var(--fill-hover); }
    .toolbar button.danger { color: var(--red); }
    .toolbar button.danger:hover { background: rgba(255, 71, 86, 0.08); }

    /* 转写结果 */
    .result {
      margin-top: 14px;
      background: var(--field-bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px 16px;
    }
    .result-head {
      display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
      font-size: 12px; color: var(--fg-3);
      border-bottom: 1px solid var(--line);
      padding-bottom: 9px; margin-bottom: 10px;
    }
    .result-head .result-title {
      flex: 1; min-width: 120px;
      color: var(--fg); font-weight: 500;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .result-archived { color: var(--fg-3); font-size: 11px; flex: none; }
    .result-body {
      font-family: var(--mono); font-size: 12.5px; line-height: 1.75;
      color: var(--fg);
      white-space: pre-wrap; word-break: break-word;
      max-height: 380px; overflow: auto;
      padding-right: 8px;
    }
    .result-body::-webkit-scrollbar { width: 8px; }
    .result-body::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
    .result-body::-webkit-scrollbar-track { background: transparent; }

    footer {
      display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      border-top: 1px solid var(--line);
      margin-top: 48px; padding: 16px 2px 6px;
      color: var(--fg-3); font-size: 12px;
    }
    footer a { color: var(--fg-2); text-decoration: none; }
    footer a:hover { color: var(--blue); text-decoration: underline; }

    @media (max-width: 760px) {
      .row, .row-2 { grid-template-columns: 1fr; }
      .console-top { padding: 12px 16px; }
      .model-tag { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="console-top">
    <div class="brand">
      <span class="wordmark">MediaScribe</span>
      <span class="model-tag">视频转 Markdown</span>
    </div>
    <div class="meters">
      <span id="rec-light" class="rec"><i></i><span id="rec-count"></span></span>
      <span id="gpu-pill" class="chip-status loading" title="GPU 状态 · 每 5 秒刷新">
        <span class="dot"></span>
        <span id="gpu-label">GPU …</span>
      </span>
      <button type="button" id="theme-toggle" class="icon-btn" title="切换主题">☀ 亮面</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>视频进去,文稿出来。</h1>
      <p class="lede">粘贴 Bilibili / 抖音 / YouTube / 小红书 / 微信公众号 链接(单次最多 20 条)。服务端按 <code>下载 → 提取音频 → 转写 → 合并</code> 四级信号链逐级处理,实时进度经 WebSocket 推送,随时可取消,产出可复制的 Markdown 文稿。</p>
    </section>

    <form id="form" class="panel">
      <div class="fld">
        <label for="urls">视频链接 <span class="hint">每行一条</span></label>
        <textarea id="urls" spellcheck="false" placeholder="https://www.bilibili.com/video/BV…
https://www.douyin.com/video/…
https://www.youtube.com/watch?v=…" required></textarea>
      </div>

      <div class="row">
        <div class="fld">
          <label for="engine">识别引擎 <span class="hint">可选</span></label>
          <select id="engine">
            <option value="whisper">whisper(基线)</option>
            <option value="faster-whisper">faster-whisper</option>
            <option value="whisperx">whisperx</option>
          </select>
        </div>
        <div class="fld">
          <label for="model">模型 <span class="hint">默认 small</span></label>
          <select id="model">
            <optgroup label="快速预览">
              <option value="tiny">tiny</option>
              <option value="base">base</option>
              <option value="small" selected>small</option>
            </optgroup>
            <optgroup label="准确率优先">
              <option value="medium">medium</option>
              <option value="large">large</option>
              <option value="large-v1">large-v1</option>
              <option value="large-v2">large-v2</option>
              <option value="large-v3">large-v3(中文最佳)</option>
            </optgroup>
            <optgroup label="速度 + 准确率">
              <option value="distil-large-v2">distil-large-v2</option>
              <option value="distil-large-v3">distil-large-v3</option>
            </optgroup>
          </select>
        </div>
        <div class="fld">
          <label for="language">语言 <span class="hint">可留空</span></label>
          <input type="text" id="language" placeholder="zh, en, ja, …">
        </div>
      </div>

      <div class="row">
        <div class="fld">
          <label for="ocr">图文识别 <span class="hint">公众号图片</span></label>
          <select id="ocr">
            <option value="auto" selected>auto</option>
            <option value="paddleocr">paddleocr</option>
            <option value="pytesseract">pytesseract</option>
            <option value="easyocr">easyocr</option>
            <option value="none">none</option>
          </select>
        </div>
        <div class="fld">
          <label for="cookies">公众号 Cookies <span class="hint">可选</span></label>
          <input type="text" id="cookies" autocomplete="off" placeholder="wxuin=abc; pass_ticket=xyz">
        </div>
        <div class="fld">
          <label>输出选项</label>
          <label class="switch">
            <input type="checkbox" id="bilingual">
            <span class="track"></span>
            <span class="sw-label">双语字幕</span>
          </label>
        </div>
      </div>

      <div class="row-2">
        <div class="fld">
          <label for="api-token">API 令牌 <span class="hint">仅服务器开启鉴权时需要</span></label>
          <input type="password" id="api-token" autocomplete="off" placeholder="未开启鉴权则留空">
        </div>
        <div class="fld">
          <label>&nbsp;</label>
          <label class="switch">
            <input type="checkbox" id="remember-token" checked>
            <span class="track"></span>
            <span class="sw-label">在本机记住令牌</span>
          </label>
        </div>
      </div>

      <button class="run" id="submit" type="submit">运行转写 <kbd>Ctrl + ⏎</kbd></button>
      <p class="status" id="status" aria-live="polite">就绪,等待输入。</p>
    </form>

    <div class="output-head">
      <h2>输出队列</h2>
      <button class="ghost" id="clear-done" type="button">清空已结束</button>
    </div>

    <section class="results" id="results">
      <div class="empty" id="empty-state">队列空闲 — 提交链接后,任务会出现在这里</div>
    </section>

    <footer>
      <span>MediaScribe v3.3.0 — 本地优先的视频转写工具</span>
      <span><a href="/wiki">知识库</a> · <a href="/api/health" target="_blank" rel="noopener">/api/health</a> · <a href="/extension" target="_blank" rel="noopener">浏览器扩展</a></span>
    </footer>
  </main>

  <script>
    "use strict";
    const $ = (id) => document.getElementById(id);

    // ---------------------------------------------------------------------
    // 主题: 月之暗面 (dark) / 月之亮面 (light) — head 内脚本已设初始值
    // ---------------------------------------------------------------------
    const themeBtn = $("theme-toggle");
    function applyTheme(t) {
      document.documentElement.dataset.theme = t;
      themeBtn.textContent = t === "light" ? "☾ 暗面" : "☀ 亮面";
      themeBtn.title = t === "light" ? "切换到月之暗面" : "切换到月之亮面";
    }
    let theme = null;
    try { theme = localStorage.getItem("ms_theme"); } catch (_) { /* storage 不可用 */ }
    if (!theme) theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    applyTheme(theme);
    themeBtn.addEventListener("click", () => {
      theme = document.documentElement.dataset.theme === "light" ? "dark" : "light";
      applyTheme(theme);
      try { localStorage.setItem("ms_theme", theme); } catch (_) { /* storage 不可用 */ }
    });

    const form = $("form");
    const statusEl = $("status");
    const results = $("results");
    const submit = $("submit");
    const emptyState = $("empty-state");

    function setStatus(msg, isError) {
      statusEl.textContent = msg;
      statusEl.classList.toggle("err", Boolean(isError));
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }

    // ---------------------------------------------------------------------
    // 机台指示: 任务运行计数 — 有活跃任务时出现
    // ---------------------------------------------------------------------
    const activeJobs = new Set();
    function updateMeters() {
      const n = activeJobs.size;
      $("rec-light").classList.toggle("on", n > 0);
      $("rec-count").textContent = n > 0 ? `${n} 个任务运行中` : "";
    }

    // ---------------------------------------------------------------------
    // GPU 状态: 轮询 /api/health, 每 5 秒刷新
    // ---------------------------------------------------------------------
    const gpuPill = $("gpu-pill");
    const gpuLabel = $("gpu-label");

    function fmtMb(mb) {
      if (mb == null) return "?";
      if (mb >= 1024) return (mb / 1024).toFixed(1) + "G";
      return Math.round(mb) + "M";
    }

    function renderGpuPill(health) {
      const gpu = health && health.gpu;
      if (!gpu || !gpu.available) {
        gpuPill.className = "chip-status";
        gpuLabel.textContent = "CPU 模式";
        return;
      }
      const name = gpu.name || gpu.device || "GPU";
      const shortName = name.length > 20 ? name.slice(0, 18) + "…" : name;
      const util = gpu.utilisation_pct != null ? Math.round(gpu.utilisation_pct) : null;
      const vram = gpu.vram_total_mb != null
        ? ` · ${fmtMb(gpu.vram_used_mb)}/${fmtMb(gpu.vram_total_mb)}` : "";
      gpuPill.className = "chip-status ok";
      gpuLabel.textContent = `${shortName}${vram}${util != null ? ` · ${util}%` : ""}`;
    }

    async function pollGpu() {
      try {
        const r = await fetch("/api/health");
        if (r.ok) renderGpuPill(await r.json());
        else { gpuPill.className = "chip-status"; gpuLabel.textContent = "CPU 模式"; }
      } catch (_) {
        gpuPill.className = "chip-status";
        gpuLabel.textContent = "离线";
      }
    }
    pollGpu();
    setInterval(pollGpu, 5000);

    // ---------------------------------------------------------------------
    // API 令牌 — 仅当服务器设置 MEDIASCRIBE_API_TOKEN 时需要。
    // HTTP 走 Bearer 头; WebSocket 经 ?token= 传递。默认记住在本机。
    // ---------------------------------------------------------------------
    const tokenInput = $("api-token");
    const rememberToken = $("remember-token");
    try { tokenInput.value = localStorage.getItem("v2t_api_token") || ""; } catch (_) { /* storage 不可用 */ }
    tokenInput.addEventListener("change", () => {
      try {
        if (tokenInput.value && rememberToken.checked) localStorage.setItem("v2t_api_token", tokenInput.value);
        else localStorage.removeItem("v2t_api_token");
      } catch (_) { /* storage 不可用 */ }
    });
    rememberToken.addEventListener("change", () => {
      try {
        if (!rememberToken.checked) localStorage.removeItem("v2t_api_token");
        else if (tokenInput.value) localStorage.setItem("v2t_api_token", tokenInput.value);
      } catch (_) { /* storage 不可用 */ }
    });

    function apiToken() { return tokenInput.value.trim(); }
    function authHeaders() {
      const t = apiToken();
      return t ? { "Authorization": "Bearer " + t } : {};
    }
    function wsUrl(path) {
      const t = apiToken();
      const q = t ? "?token=" + encodeURIComponent(t) : "";
      return (location.protocol === "https:" ? "wss:" : "ws:") + "//" + location.host + path + q;
    }

    // ---------------------------------------------------------------------
    // 提交 → POST /api/jobs(异步任务 + 取消 + WS 进度)
    // ---------------------------------------------------------------------
    const STAGES = ["download", "extract_audio", "transcribe", "merge"];
    const STAGE_LABELS = {
      download: "下载",
      extract_audio: "提取音频",
      transcribe: "转写",
      merge: "合并",
    };

    $("urls").addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const urls = $("urls").value.split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
      if (urls.length === 0) { setStatus("请先粘贴至少一条链接。", true); return; }
      submit.disabled = true;
      setStatus(`正在提交 ${urls.length} 条链接…`);
      try {
        const body = {
          urls,
          engine: $("engine").value,
          model: $("model").value,
          language: $("language").value || null,
          ocr_engine: $("ocr").value,
          wechat_cookies: $("cookies").value || null,
          bilingual: $("bilingual").checked,
        };
        const resp = await fetch("/api/jobs", {
          method: "POST",
          headers: { "Content-Type": "application/json", ...authHeaders() },
          body: JSON.stringify(body),
        });
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({ detail: resp.statusText }));
          throw new Error(err.detail || resp.statusText);
        }
        const data = await resp.json();
        const jobs = data.jobs || [];
        let msg = `已提交 ${jobs.length} 个任务,信号链启动…`;
        if (data.requested > data.unique) msg += `(已合并 ${data.requested - data.unique} 条重复链接)`;
        setStatus(msg);
        emptyState.style.display = "none";
        for (const job of jobs) renderJobCard(job);
      } catch (err) {
        setStatus("提交失败:" + err.message, true);
      } finally {
        submit.disabled = false;
      }
    });

    // ---------------------------------------------------------------------
    // 任务卡片 + WS 进度 + 取消 + 结果拉取
    // ---------------------------------------------------------------------
    function renderJobCard(job) {
      const card = document.createElement("article");
      card.className = "card";
      card.dataset.jobId = job.job_id;
      card.innerHTML = `
        <div class="card-top">
          <span class="chip" data-chip>排队中</span>
          <span class="url" title="${escapeHtml(job.url)}">${escapeHtml(job.url)}</span>
          <span class="jid">#${escapeHtml(job.job_id.slice(0, 8))}</span>
        </div>
        <div class="chain" aria-label="处理进度">
          ${STAGES.map((s, i) => `
            ${i > 0 ? '<span class="seg"><i></i></span>' : ""}
            <span class="node" data-node="${s}" title="${STAGE_LABELS[s]}">${String(i + 1).padStart(2, "0")}</span>
          `).join("")}
        </div>
        <p class="chain-meta"><span class="cm-label">阶段</span><span data-stage-label>—</span><span data-pct>—</span></p>
        <p class="errmsg" data-err></p>
        <div class="toolbar">
          <button type="button" data-cancel class="danger">终止</button>
          <button type="button" data-copy style="display:none;">复制文稿</button>
          <button type="button" data-download style="display:none;">下载 .md</button>
        </div>`;
      results.appendChild(card);
      activeJobs.add(job.job_id);
      updateMeters();
      connectWs(card, job);
    }

    function connectWs(card, job) {
      const ws = new WebSocket(wsUrl(`/ws/progress/${job.job_id}`));
      const nodes = {};
      const segs = {};
      card.querySelectorAll(".node").forEach((n) => { nodes[n.dataset.node] = n; });
      STAGES.forEach((s, i) => { if (i > 0) segs[s] = card.querySelectorAll(".seg")[i - 1]; });
      const chip = card.querySelector("[data-chip]");
      const stageLabel = card.querySelector("[data-stage-label]");
      const pctEl = card.querySelector("[data-pct]");
      const errEl = card.querySelector("[data-err]");

      function setChip(state, text) {
        chip.className = "chip " + state;
        chip.textContent = text;
      }

      // 运行态微光: 阶段名与百分比流动, 直至进入终态
      function setRunning(on) {
        stageLabel.classList.toggle("running-text", on);
        pctEl.classList.toggle("running-text", on);
      }

      function finishCard(state, chipText) {
        card.classList.remove("ok", "err", "cancelled");
        card.classList.add(state);
        setChip(state === "cancelled" ? "cancelled" : state, chipText);
        activeJobs.delete(job.job_id);
        updateMeters();
      }

      function resetNode(s) {
        const n = nodes[s];
        n.className = "node";
        n.textContent = String(STAGES.indexOf(s) + 1).padStart(2, "0");
      }

      function setStage(stage, pct, done) {
        const idx = STAGES.indexOf(stage);
        if (idx < 0) return;
        STAGES.forEach((s, i) => {
          if (i < idx || (i === idx && done)) { nodes[s].className = "node done"; nodes[s].textContent = "✓"; }
          else if (i === idx) { nodes[s].className = "node active"; nodes[s].textContent = "▶"; }
          else resetNode(s);
        });
        STAGES.forEach((s, j) => {
          if (j === 0) return;
          // segs[s] 是"流入节点 j"的那段导线 — 代表阶段 j-1 的进度
          const seg = segs[s];
          const prev = j - 1;
          const fill = seg.querySelector("i");
          if (prev < idx || (prev === idx && done)) { seg.className = "seg done"; fill.className = ""; fill.style.width = "100%"; }
          else if (prev === idx) {
            seg.className = "seg";
            fill.className = "shimmer-bar";
            fill.style.width = pct + "%";
          }
          else { seg.className = "seg"; fill.className = ""; fill.style.width = "0%"; }
        });
        stageLabel.textContent = STAGE_LABELS[stage] || stage;
        delete stageLabel.dataset.state;
        pctEl.textContent = Math.round(pct) + "%";
      }

      function markCancelled() {
        STAGES.forEach((s) => { resetNode(s); nodes[s].classList.add("off"); });
        STAGES.forEach((s, i) => {
          if (i > 0) { const f = segs[s].querySelector("i"); segs[s].className = "seg"; f.className = ""; f.style.width = "0%"; }
        });
        stageLabel.textContent = "已取消";
        stageLabel.dataset.state = "off";
        pctEl.textContent = "—";
        setRunning(false);
        finishCard("cancelled", "已取消");
      }

      card.querySelector("[data-cancel]").addEventListener("click", async () => {
        try {
          const r = await fetch(`/api/jobs/${job.job_id}/cancel`, { method: "POST", headers: authHeaders() });
          setStatus(r.ok ? `已请求取消 ${job.job_id.slice(0, 8)}` : "取消失败:任务不存在或已结束", !r.ok);
        } catch (_) { /* 网络异常, WS 终态为准 */ }
      });

      ws.onmessage = (ev) => {
        let msg;
        try { msg = JSON.parse(ev.data); } catch (_) { return; }
        if (!msg || typeof msg !== "object") return;
        const stage = msg.stage;
        const evt = msg.event;
        if (evt === "ping" || evt === "snapshot") {
          if (evt === "snapshot" && msg.cancelled) markCancelled();
          return;
        }
        if (evt === "stage_start") { setChip("busy", "运行中"); setRunning(true); setStage(stage, 0, false); }
        else if (evt === "stage_progress") { setChip("busy", "运行中"); setRunning(true); setStage(stage, msg.total > 0 ? (msg.current / msg.total) * 100 : 0, false); }
        else if (evt === "stage_done") { setStage(stage, 100, true); }
        else if (evt === "succeeded") {
          setStage("merge", 100, true);
          setRunning(false);
          finishCard("ok", "完成");
          stageLabel.textContent = "完成";
          stageLabel.dataset.state = "ok";
          pctEl.textContent = "100%";
          fetchResult(card, job);
        } else if (evt === "failed") {
          const idx = STAGES.indexOf(stage);
          STAGES.forEach((s, i) => { if (i < idx) { nodes[s].className = "node done"; nodes[s].textContent = "✓"; } });
          const bad = nodes[stage] || nodes[STAGES[STAGES.length - 1]];
          if (bad) { bad.className = "node fail"; bad.textContent = "×"; }
          errEl.textContent = msg.error || "未知错误";
          errEl.classList.add("show");
          stageLabel.textContent = "失败";
          stageLabel.dataset.state = "err";
          setRunning(false);
          finishCard("err", "失败");
          ws.close();
        } else if (evt === "cancelled" || evt === "cancelled_done") {
          markCancelled();
          ws.close();
        }
      };
      ws.onerror = () => { /* 以服务端 close 为准 */ };
      ws.onclose = () => {
        // 终态事件会先把 job 移出 activeJobs 再主动 close; 走到这里说明
        // 连接是意外断开的(如空闲超时) — 提示用户, 不再让指示灯空转。
        if (activeJobs.has(job.job_id)) {
          activeJobs.delete(job.job_id);
          updateMeters();
          setRunning(false);
          chip.className = "chip cancelled";
          chip.textContent = "连接断开";
          setStatus("进度连接已断开(任务可能仍在后台运行),可稍后刷新页面查看结果。", true);
        }
      };
    }

    async function fetchResult(card, job) {
      try {
        const r = await fetch(`/api/jobs/${job.job_id}/result`, { headers: authHeaders() });
        if (!r.ok) return;
        const data = await r.json();
        if (!data.markdown) return;
        const dateStr = new Date().toLocaleDateString("zh-CN");
        const archived = data.wiki && data.wiki.raw
          ? `<span class="result-archived" title="已归档到知识库: ${escapeHtml(data.wiki.raw)}">已归档知识库</span>`
          : "";
        const wrap = document.createElement("div");
        wrap.className = "result";
        wrap.innerHTML = `
          <div class="result-head">
            <span>转写文稿</span>
            <span class="result-title">${escapeHtml(data.title || "未命名文稿")}</span>
            ${archived}
            <span>${escapeHtml(dateStr)}</span>
          </div>
          <div class="result-body"></div>`;
        wrap.querySelector(".result-body").textContent = data.markdown;
        card.appendChild(wrap);
        const copyBtn = card.querySelector("[data-copy]");
        const dlBtn = card.querySelector("[data-download]");
        copyBtn.style.display = "";
        dlBtn.style.display = "";
        copyBtn.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(data.markdown);
            setStatus(`已复制文稿:${data.title || job.url}`);
            const label = copyBtn.textContent;
            copyBtn.textContent = "✓ 已复制";
            setTimeout(() => { copyBtn.textContent = label; }, 1500);
          } catch (_) { setStatus("复制失败:浏览器拒绝了剪贴板访问", true); }
        });
        dlBtn.addEventListener("click", () => {
          const blob = new Blob([data.markdown], { type: "text/markdown" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = (data.title || job.url).replace(/[^a-z0-9\u4e00-\u9fff]+/gi, "_").slice(0, 60) + ".md";
          a.click();
          URL.revokeObjectURL(a.href);
        });
      } catch (_) { /* 网络异常 */ }
    }

    // 清空已结束(ok / 失败 / 已取消)的任务卡片
    $("clear-done").addEventListener("click", () => {
      const done = [...results.querySelectorAll(".card")].filter(
        (c) => c.classList.contains("ok") || c.classList.contains("err") || c.classList.contains("cancelled")
      );
      done.forEach((c) => c.remove());
      if (!results.querySelector(".card")) emptyState.style.display = "";
    });
  </script>
</body>
</html>
